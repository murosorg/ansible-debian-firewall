nftables_config:
  vars:
    wan_interface: eth0
    lan_interface: eth1
  tables:
    firewall:
      type: inet
      chains:
        input:
          hook: input
          policy: drop
        forward:
          hook: forward
          policy: drop
        output:
          hook: output
          policy: accept
        postrouting:
          type: nat
          hook: postrouting
          policy: accept
        prerouting:
          type: nat
          hook: prerouting
          policy: accept
nftables_networks:
  lan:
  - 10.20.10.0/24
  vpn:
  - 10.100.0.0/27
nftables_hosts:
  web01: 10.20.10.10
  mail01: 10.20.10.80
nftables_host_groups:
  public_web:
    hosts:
    - web01
  mail_servers:
    hosts:
    - mail01
nftables_services:
  web:
    protocols:
      tcp:
      - 80
      - 443
  mail:
    protocols:
      tcp:
      - 25
      - 465
      - 587
      - 993
  wireguard:
    protocols:
      udp:
      - 51820
nftables_rules:
- chain: input
  protocol_raw: ip protocol ospf
  action: accept
- chain: input
  source_interface: $lan_interface
  protocol_raw: ip protocol 112
  action: accept
- chain: input
  source_interface: $lan_interface
  service: wireguard
  protocol: udp
  action: accept
- chain: input
  source_interface: $lan_interface
  protocol: udp
  ports:
  - 3780
  action: accept
- chain: input
  source_interface: $wan_interface
  service: wireguard
  protocol: udp
  action: accept
- chain: forward
  source_interface: $lan_interface
  destination_interface: $wan_interface
  source_network: 10.20.10.0/24
  action: accept
- chain: forward
  source_interface: $wan_interface
  destination_interface: $lan_interface
  destination_group: public_web
  service: web
  protocol: tcp
  action: accept
- chain: forward
  source_interface: $wan_interface
  destination_interface: $lan_interface
  destination_group: mail_servers
  service: mail
  protocol: tcp
  action: accept
- chain: forward
  source_interface: wg0
  destination_interface: $lan_interface
  source_network: 10.100.0.0/27
  action: accept
- chain: prerouting
  source_interface: $wan_interface
  protocol: tcp
  ports:
  - 80
  destination_host: web01
  destination_port: 80
  action: dnat
- chain: prerouting
  source_interface: $wan_interface
  protocol: tcp
  ports:
  - 443
  destination_host: web01
  destination_port: 443
  action: dnat
- chain: prerouting
  source_interface: $wan_interface
  protocol: tcp
  service: mail
  destination_host: mail01
  action: dnat
- chain: forward
  source_interface: $wan_interface
  destination_interface: wg0
  destination_network: 10.100.0.0/27
  ct_state: established,related
  action: accept
- chain: forward
  source_interface: wg0
  destination_interface: $wan_interface
  source_network: 10.100.0.0/27
  destination_network: 10.10.10.0/24
  action: accept
- chain: forward
  source_interface: wg0
  destination_interface: $lan_interface
  destination_network: 10.20.10.0/24
  source_network: 10.100.0.0/27
  action: accept
- chain: postrouting
  source_network: 10.20.10.0/24
  destination_interface: $wan_interface
  action: masquerade
- chain: postrouting
  source_network: 10.100.0.0/27
  destination_interface: $wan_interface
  action: masquerade
