---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true

- name: Configure rsyslog forwarding
  ansible.builtin.template:
    src: rsyslog.conf.j2
    dest: "{{ base_rsyslog_config }}"
    owner: root
    group: root
    mode: "0644"
  when: base_rsyslog_enabled
  notify: Restart rsyslog

- name: Enable rsyslog
  ansible.builtin.service:
    name: "{{ base_rsyslog_service }}"
    enabled: true
    state: started
  when: base_rsyslog_enabled

- name: Enable chrony
  ansible.builtin.service:
    name: "{{ base_chrony_service }}"
    enabled: true
    state: started
  when: base_chrony_enabled
