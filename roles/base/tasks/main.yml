---
- name: Assert Debian version
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution_major_version | int <= 13

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true

- name: Install chrony
  ansible.builtin.apt:
    name: "{{ base_chrony_package }}"
    state: present
  when: base_chrony_enabled

- name: Install rsyslog
  ansible.builtin.apt:
    name: "{{ base_rsyslog_package }}"
    state: present
  when: base_rsyslog_enabled

- name: Install snmpd
  ansible.builtin.apt:
    name: "{{ base_snmpd_package }}"
    state: present
  when: base_snmpd_enabled

- name: Configure chrony sources
  ansible.builtin.template:
    src: chrony.sources.j2
    dest: "{{ base_chrony_sources_file }}"
    owner: root
    group: root
    mode: "0644"
  when: base_chrony_enabled
  notify: Restart chrony

- name: Configure snmpd
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: "{{ base_snmpd_config }}"
    owner: root
    group: root
    mode: "0600"
  when: base_snmpd_enabled
  notify: Restart snmpd

- name: Configure rsyslog forwarding
  ansible.builtin.template:
    src: rsyslog.conf.j2
    dest: "{{ base_rsyslog_config }}"
    owner: root
    group: root
    mode: "0644"
  when: base_rsyslog_enabled
  notify: Restart rsyslog

- name: Enable rsyslog
  ansible.builtin.service:
    name: "rsyslog"
    enabled: true
    state: started
  when: base_rsyslog_enabled

- name: Enable chrony
  ansible.builtin.service:
    name: "chrony"
    enabled: true
    state: started
  when: base_chrony_enabled

- name: Enable snmpd
  ansible.builtin.service:
    name: "snmpd"
    enabled: true
    state: started
  when: base_snmpd_enabled
