---
base_packages:
  - bind9-dnsutils
  - iproute2
  - iputils-ping
  - procps
  - netcat-openbsd
  - tcpdump
  - traceroute
base_chrony_enabled: false
base_chrony_package: chrony
base_rsyslog_enabled: false
base_rsyslog_package: rsyslog
base_rsyslog_config: /etc/rsyslog.d/10-base.conf
base_rsyslog_rules: []
base_snmpd_enabled: false
base_snmpd_package: snmpd
base_chrony_sources_file: /etc/chrony/sources.d/10-base.sources
base_chrony_servers: []
base_snmpd_config: /etc/snmp/snmpd.conf
base_snmpd_rules: []
